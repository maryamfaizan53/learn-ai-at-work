<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The Authority Envelope</title>
<desc id="d">A worker's authority is a ladder of four rungs, each including the ones below: observe (read and report), recommend (suggest what to do), draft (prepare something for a person to approve and send) and execute (do it itself). For anything outside its envelope it escalates: it stops and hands the case to a named person. The risky pair is untrusted outside text, such as an email anyone can write, together with the power to act outward, such as sending, paying or changing records. Never give one worker both.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b7a6a"/></marker></defs>
<rect width="1200" height="450" rx="18" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="1198.5" height="448.5" rx="18" fill="none" stroke="#cfdcd4" stroke-width="1.5"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0">
<text x="40" y="38" font-size="14" font-weight="700" fill="#1f7a50" text-anchor="start">THE AUTHORITY ENVELOPE</text>
<rect x="40" y="66" width="470" height="70" rx="12" fill="#d0453f" fill-opacity="0.1" stroke="#d0453f" stroke-width="1.5"/>
<text x="62" y="96" font-size="19" font-weight="800" fill="#d0453f" text-anchor="start">Execute</text>
<text x="62" y="120" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">Does it itself.</text>
<text x="490" y="108" font-size="22" font-weight="800" fill="#d0453f" text-anchor="end">4</text>
<rect x="40" y="150" width="470" height="70" rx="12" fill="#c98a1a" fill-opacity="0.1" stroke="#c98a1a" stroke-width="1.5"/>
<text x="62" y="180" font-size="19" font-weight="800" fill="#c98a1a" text-anchor="start">Draft</text>
<text x="62" y="204" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">Prepares it for a person to approve and send.</text>
<text x="490" y="192" font-size="22" font-weight="800" fill="#c98a1a" text-anchor="end">3</text>
<rect x="40" y="234" width="470" height="70" rx="12" fill="#4f5fe0" fill-opacity="0.1" stroke="#4f5fe0" stroke-width="1.5"/>
<text x="62" y="264" font-size="19" font-weight="800" fill="#4f5fe0" text-anchor="start">Recommend</text>
<text x="62" y="288" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">Suggests what to do, with reasons.</text>
<text x="490" y="276" font-size="22" font-weight="800" fill="#4f5fe0" text-anchor="end">2</text>
<rect x="40" y="318" width="470" height="70" rx="12" fill="#1f9d63" fill-opacity="0.1" stroke="#1f9d63" stroke-width="1.5"/>
<text x="62" y="348" font-size="19" font-weight="800" fill="#1f9d63" text-anchor="start">Observe</text>
<text x="62" y="372" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">Reads and reports. Changes nothing.</text>
<text x="490" y="360" font-size="22" font-weight="800" fill="#1f9d63" text-anchor="end">1</text>
<path d="M528 396 V72" stroke="#5b7a6a" stroke-width="2" marker-end="url(#ah)"/>
<text x="546" y="204" font-size="15" font-weight="700" fill="#10261b" text-anchor="start">More authority.</text>
<text x="546" y="228" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">Each rung</text>
<text x="546" y="248" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">includes the</text>
<text x="546" y="268" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">ones below.</text>
<rect x="680" y="66" width="480" height="128" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="680" y="78" width="5" height="104" rx="2.5" fill="#4f5fe0"/>
<text x="702" y="98" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">Outside the envelope? Escalate.</text>
<text x="702" y="125" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">The worker stops and hands the case to a named</text>
<text x="702" y="147" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">person. A brief can narrow the envelope, never</text>
<text x="702" y="169" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">widen it.</text>
<rect x="680" y="214" width="480" height="196" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<text x="702" y="248" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">Break the risky pair</text>
<rect x="702" y="266" width="200" height="82" rx="10" fill="#c98a1a" fill-opacity="0.1" stroke="#c98a1a" stroke-width="1.5"/>
<text x="714" y="292" font-size="15" font-weight="700" fill="#c98a1a" text-anchor="start">Untrusted text: an</text>
<text x="714" y="312" font-size="15" font-weight="700" fill="#c98a1a" text-anchor="start">email anyone can write</text>
<text x="920" y="315" font-size="28" font-weight="800" fill="#d0453f" text-anchor="middle">+</text>
<rect x="938" y="266" width="200" height="82" rx="10" fill="#d0453f" fill-opacity="0.1" stroke="#d0453f" stroke-width="1.5"/>
<text x="950" y="292" font-size="15" font-weight="700" fill="#d0453f" text-anchor="start">Power to act outward:</text>
<text x="950" y="312" font-size="15" font-weight="700" fill="#d0453f" text-anchor="start">send, pay, change</text>
<text x="702" y="374" font-size="15" font-weight="400" fill="#4d6156" text-anchor="start">Never give one worker both. Keep the one that reads</text>
<text x="702" y="394" font-size="15" font-weight="400" fill="#4d6156" text-anchor="start">emails at observe, recommend or draft.</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
