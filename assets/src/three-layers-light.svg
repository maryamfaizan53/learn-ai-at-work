<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Three layers of protection: instruction, permission, verification</title>
<desc id="d">An instruction tells the AI what not to do, for example never commit or push, but the AI can still do it by mistake. A permission makes it unable to, for example no write access to your fork or ask before every action, but it is only as strong as the setting you actually configured. Verification checks afterwards that it didn't, for example reading every change in GitHub Desktop before you push, but it works only if you really read. A restriction you configured is real; one you only assumed is not.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b7a6a"/></marker></defs>
<rect width="1200" height="450" rx="18" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="1198.5" height="448.5" rx="18" fill="none" stroke="#cfdcd4" stroke-width="1.5"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0">
<text x="40" y="38" font-size="14" font-weight="700" fill="#1f7a50" text-anchor="start">THREE LAYERS OF PROTECTION</text>
<text x="230" y="74" font-size="15" font-weight="700" fill="#74867c" text-anchor="start">What it does</text>
<text x="540" y="74" font-size="15" font-weight="700" fill="#74867c" text-anchor="start">Example in this bootcamp</text>
<text x="850" y="74" font-size="15" font-weight="700" fill="#74867c" text-anchor="start">Its limit</text>
<rect x="40" y="90" width="1120" height="92" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="40" y="90" width="170" height="92" rx="14" fill="#c98a1a" fill-opacity="0.1" stroke="#c98a1a" stroke-width="1.5"/>
<text x="125" y="142" font-size="19" font-weight="800" fill="#c98a1a" text-anchor="middle">Instruction</text>
<text x="230" y="126" font-size="16" font-weight="600" fill="#10261b" text-anchor="start">Tells the AI what not to do.</text>
<text x="540" y="126" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">“Never commit or push.” in your</text>
<text x="540" y="148" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">project instructions.</text>
<text x="850" y="126" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">The AI can still do it, by</text>
<text x="850" y="148" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">mistake or when told otherwise.</text>
<rect x="40" y="194" width="1120" height="92" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="40" y="194" width="170" height="92" rx="14" fill="#1f9d63" fill-opacity="0.1" stroke="#1f9d63" stroke-width="1.5"/>
<text x="125" y="246" font-size="19" font-weight="800" fill="#1f9d63" text-anchor="middle">Permission</text>
<text x="230" y="230" font-size="16" font-weight="600" fill="#10261b" text-anchor="start">Makes it unable to.</text>
<text x="540" y="230" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">No write access to your fork;</text>
<text x="540" y="252" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">ask before every action; no</text>
<text x="540" y="274" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">connector it doesn't need.</text>
<text x="850" y="230" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Only as strong as the setting you</text>
<text x="850" y="252" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">actually configured.</text>
<rect x="40" y="298" width="1120" height="92" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="40" y="298" width="170" height="92" rx="14" fill="#4f5fe0" fill-opacity="0.1" stroke="#4f5fe0" stroke-width="1.5"/>
<text x="125" y="350" font-size="19" font-weight="800" fill="#4f5fe0" text-anchor="middle">Verification</text>
<text x="230" y="334" font-size="16" font-weight="600" fill="#10261b" text-anchor="start">Checks afterwards that it</text>
<text x="230" y="356" font-size="16" font-weight="600" fill="#10261b" text-anchor="start">didn't.</text>
<text x="540" y="334" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">You read every change in GitHub</text>
<text x="540" y="356" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Desktop before you push.</text>
<text x="850" y="334" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Works only if you really read it.</text>
<text x="40" y="428" font-size="17" font-weight="700" fill="#10261b" text-anchor="start">Configured beats assumed: ask what the AI can really reach, then check the settings yourself.</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
