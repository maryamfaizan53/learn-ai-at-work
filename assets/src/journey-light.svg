<title id="t">Your path through the bootcamp</title>
<desc id="d">Step 00 is setup. Steps 1 to 12 make you an AI Work Practitioner, steps 13 to 20 an AI Worker Designer, and steps 21 to 24 an AI Worker Manager. Prompts fade: you follow given prompts in steps 1 to 12, modify them in 13 to 20, construct them in 21 to 23, and write your own in 24. There are six milestones, with a recorded project defence at steps 7, 16, 20, 23 and 24, and the capstone ends with the changed-data check.</desc>
