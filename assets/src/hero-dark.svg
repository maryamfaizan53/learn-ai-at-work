<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Put AI Workers to Work: The CCAO-F Bootcamp</title>
  <desc id="d">A hands-on bootcamp for knowledge workers: brief a whole job, let Claude and ChatGPT do it, check every claim against its source, and have a person sign before anything leaves the company.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1712"/>
      <stop offset="0.55" stop-color="#101d17"/>
      <stop offset="1" stop-color="#14231b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16251d"/>
      <stop offset="1" stop-color="#1b2d23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#f4c15d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d8f0e2" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6fd3a3"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#7fe0b0" font-size="16" font-weight="600" letter-spacing="2.5">CCAO-F BOOTCAMP · AI AGENT FACTORY</text>
    <text x="64" y="168" fill="#f1f7f3" font-size="64" font-weight="800">Put AI Workers</text>
    <text x="64" y="240" fill="url(#accent)" font-size="64" font-weight="800">to Work</text>
    <text x="64" y="296" fill="#bfd3c7" font-size="24">Hand AI a whole job, check what comes back,</text>
    <text x="64" y="328" fill="#bfd3c7" font-size="24">and manage an AI Worker. No code needed.</text>
    <g font-size="18" font-weight="700">
      <rect x="64" y="368" width="168" height="40" rx="20" fill="#1f9d63" fill-opacity="0.15" stroke="#1f9d63"/>
      <text x="148" y="394" fill="#7fe0b0" text-anchor="middle">CCAO-F prep</text>
      <rect x="244" y="368" width="168" height="40" rx="20" fill="#5b6cff" fill-opacity="0.15" stroke="#5b6cff"/>
      <text x="328" y="394" fill="#aab4ff" text-anchor="middle">PCAO-F prep</text>
      <rect x="424" y="368" width="124" height="40" rx="20" fill="#e0a526" fill-opacity="0.16" stroke="#e0a526"/>
      <text x="486" y="394" fill="#f4c15d" text-anchor="middle">24 steps</text>
    </g>
    <text x="64" y="470" fill="#9db3a6" font-size="18">Whole jobs · Sheets, memos and slides · Projects and limits</text>
    <text x="64" y="498" fill="#9db3a6" font-size="18">The 4Ds · Role Contract · Four-Part Brief · Review contract</text>
    <text x="64" y="526" fill="#9db3a6" font-size="18">Authority Envelope · Governed knowledge · Governance · Capstone</text>
    <text x="64" y="590" fill="#7f958a" font-size="16">For absolute beginners · Learn by doing · In Claude and ChatGPT</text>

    <g>
      <rect x="720" y="78" width="480" height="92" rx="18" fill="url(#card)" stroke="#2c4437" stroke-width="2"/>
      <circle cx="768" cy="124" r="22" fill="#3ddc97" fill-opacity="0.16" stroke="#3ddc97" stroke-width="2"/>
      <text x="768" y="131" fill="#3ddc97" font-size="20" font-weight="800" text-anchor="middle">1</text>
      <text x="808" y="118" fill="#eef6f1" font-size="22" font-weight="700">Brief the job</text>
      <text x="808" y="146" fill="#a9bfb2" font-size="17">Outcome · context · format · limits</text>
    </g>    <path d="M960 172 V200" stroke="#6fd3a3" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="720" y="202" width="480" height="92" rx="18" fill="url(#card)" stroke="#2c4437" stroke-width="2"/>
      <circle cx="768" cy="248" r="22" fill="#3ddc97" fill-opacity="0.16" stroke="#3ddc97" stroke-width="2"/>
      <text x="768" y="255" fill="#3ddc97" font-size="20" font-weight="800" text-anchor="middle">2</text>
      <text x="808" y="242" fill="#eef6f1" font-size="22" font-weight="700">Claude and ChatGPT do it</text>
      <text x="808" y="270" fill="#a9bfb2" font-size="17">In a project, on your own files</text>
    </g>    <path d="M960 296 V324" stroke="#6fd3a3" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="720" y="326" width="480" height="92" rx="18" fill="url(#card)" stroke="#2c4437" stroke-width="2"/>
      <circle cx="768" cy="372" r="22" fill="#3ddc97" fill-opacity="0.16" stroke="#3ddc97" stroke-width="2"/>
      <text x="768" y="379" fill="#3ddc97" font-size="20" font-weight="800" text-anchor="middle">3</text>
      <text x="808" y="366" fill="#eef6f1" font-size="22" font-weight="700">Check every claim</text>
      <text x="808" y="394" fill="#a9bfb2" font-size="17">Review contract written first</text>
    </g>    <path d="M960 420 V448" stroke="#6fd3a3" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="720" y="450" width="480" height="92" rx="18" fill="url(#card)" stroke="#2c4437" stroke-width="2"/>
      <circle cx="768" cy="496" r="22" fill="#3ddc97" fill-opacity="0.16" stroke="#3ddc97" stroke-width="2"/>
      <text x="768" y="503" fill="#3ddc97" font-size="20" font-weight="800" text-anchor="middle">4</text>
      <text x="808" y="490" fill="#eef6f1" font-size="22" font-weight="700">A person signs</text>
      <text x="808" y="518" fill="#a9bfb2" font-size="17">Nothing leaves unchecked</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
