<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">What you set up in Step 00</title>
<desc id="d">Three places. On GitHub: your account (A1) and your fork (A3). On your computer: GitHub Desktop (A2) and your folder, cloned from the fork (A4). In the AI apps: Claude and ChatGPT (A5, A6), a Claude project on your folder and fork (A7), and a ChatGPT project where you attach files (A8). You push checked work back to your fork with GitHub Desktop. On the free route (A9) you use ordinary chats instead of projects.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b7a6a"/></marker></defs>
<rect width="1200" height="520" rx="18" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="1198.5" height="518.5" rx="18" fill="none" stroke="#cfdcd4" stroke-width="1.5"/>
