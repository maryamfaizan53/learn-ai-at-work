<text x="862" y="171" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Installed, signed in, file</text>
<text x="862" y="193" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">making on.</text>
