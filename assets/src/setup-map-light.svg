<text x="862" y="285" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Your folder + your fork + the</text>
<text x="862" y="307" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">standing instructions.</text>
<rect x="840" y="336" width="300" height="96" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="840" y="348" width="5" height="72" rx="2.5" fill="#c98a1a"/>
<text x="862" y="368" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">A8 ChatGPT project</text>
<text x="862" y="395" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">You attach files, and download</text>
<text x="862" y="417" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">results into work/.</text>
<path d="M362 270 L446 270" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
