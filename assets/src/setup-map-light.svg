<text x="840" y="92" font-size="17" font-weight="700" fill="#c98a1a" text-anchor="start">In the AI apps</text>
<rect x="60" y="112" width="300" height="98" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="60" y="124" width="5" height="74" rx="2.5" fill="#4f5fe0"/>
<text x="82" y="144" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">A1 GitHub account</text>
<text x="82" y="171" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Free. Your username is public.</text>
<rect x="60" y="236" width="300" height="104" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="60" y="248" width="5" height="80" rx="2.5" fill="#4f5fe0"/>
<text x="82" y="268" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">A3 Your fork</text>
<text x="82" y="295" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Your own copy of the bootcamp</text>
<text x="82" y="317" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">on GitHub.</text>
<rect x="450" y="112" width="300" height="98" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="450" y="124" width="5" height="74" rx="2.5" fill="#1f9d63"/>
<text x="472" y="144" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">A2 GitHub Desktop</text>
<text x="472" y="171" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Clones, shows changes,</text>
<text x="472" y="193" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">commits, pushes.</text>
<rect x="450" y="236" width="300" height="104" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="450" y="248" width="5" height="80" rx="2.5" fill="#1f9d63"/>
<text x="472" y="268" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">A4 Your folder</text>
<text x="472" y="295" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">The clone on your computer.</text>
<text x="472" y="317" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">All your work is saved here.</text>
<rect x="840" y="112" width="300" height="98" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
