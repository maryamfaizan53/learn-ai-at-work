<text x="782" y="360" font-size="14" font-weight="600" fill="#4d6156" text-anchor="end">attach</text>
<rect x="40" y="458" width="1120" height="44" rx="12" fill="#8a9a91" fill-opacity="0.1" stroke="#8a9a91" stroke-width="1.5"/>
<text x="60" y="486" font-size="16" font-weight="600" fill="#4d6156" text-anchor="start">Free route (A9): no projects. Attach the files to ordinary chats and save what the AI makes into work/ yourself.</text>
</g>
