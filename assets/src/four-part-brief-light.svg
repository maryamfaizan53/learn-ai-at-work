<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The Four-Part Brief</title>
<desc id="d">A one-line request leaves the AI to guess. A Four-Part Brief has an outcome (what exists when the work is done, ending with a done-when sentence), context (who it is for, and which source wins when sources disagree), format (the shape the next reader needs) and constraints (content rules and how far the worker may go alone). It also names any control step that policy, law or a system requires; every other step is method, left to the worker.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b7a6a"/></marker></defs>
<rect width="1200" height="400" rx="18" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="18" fill="none" stroke="#cfdcd4" stroke-width="1.5"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0">
<text x="40" y="38" font-size="14" font-weight="700" fill="#1f7a50" text-anchor="start">THE FOUR-PART BRIEF</text>
<rect x="40" y="70" width="250" height="254" rx="14" fill="#f6f9f7" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="104" font-size="18" font-weight="700" fill="#74867c" text-anchor="start">A one-line request</text>
<text x="60" y="140" font-size="17" font-weight="400" fill="#74867c" text-anchor="start" font-style="italic">“Do this week's</text>
<text x="60" y="164" font-size="17" font-weight="400" fill="#74867c" text-anchor="start" font-style="italic">reminders.”</text>
<text x="60" y="208" font-size="15" font-weight="400" fill="#74867c" text-anchor="start">The AI has to guess what</text>
<text x="60" y="228" font-size="15" font-weight="400" fill="#74867c" text-anchor="start">done looks like, which</text>
<text x="60" y="248" font-size="15" font-weight="400" fill="#74867c" text-anchor="start">file wins, what shape you</text>
<text x="60" y="268" font-size="15" font-weight="400" fill="#74867c" text-anchor="start">need and how far it may</text>
<text x="60" y="288" font-size="15" font-weight="400" fill="#74867c" text-anchor="start">go.</text>
<path d="M296 197 L336 197" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="344" y="70" width="396" height="120" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="344" y="82" width="5" height="96" rx="2.5" fill="#1f9d63"/>
<circle cx="380" cy="100" r="15" fill="#1f9d63" fill-opacity="0.16" stroke="#1f9d63" stroke-width="1.5"/>
<text x="380" y="106" font-size="15" font-weight="800" fill="#1f9d63" text-anchor="middle">1</text>
<text x="404" y="102" font-size="20" font-weight="700" fill="#10261b" text-anchor="start">Outcome</text>
<text x="366" y="130" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">What exists when the work is done, ending</text>
<text x="366" y="152" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">with a “done when” sentence.</text>
<rect x="756" y="70" width="396" height="120" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="756" y="82" width="5" height="96" rx="2.5" fill="#4f5fe0"/>
<circle cx="792" cy="100" r="15" fill="#4f5fe0" fill-opacity="0.16" stroke="#4f5fe0" stroke-width="1.5"/>
<text x="792" y="106" font-size="15" font-weight="800" fill="#4f5fe0" text-anchor="middle">2</text>
<text x="816" y="102" font-size="20" font-weight="700" fill="#10261b" text-anchor="start">Context</text>
<text x="778" y="130" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Who it is for, and which source is the</text>
<text x="778" y="152" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">authority when sources disagree.</text>
<rect x="344" y="204" width="396" height="120" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="344" y="216" width="5" height="96" rx="2.5" fill="#c98a1a"/>
<circle cx="380" cy="234" r="15" fill="#c98a1a" fill-opacity="0.16" stroke="#c98a1a" stroke-width="1.5"/>
<text x="380" y="240" font-size="15" font-weight="800" fill="#c98a1a" text-anchor="middle">3</text>
<text x="404" y="236" font-size="20" font-weight="700" fill="#10261b" text-anchor="start">Format</text>
<text x="366" y="264" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">The shape the next reader needs: a table,</text>
<text x="366" y="286" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">a file, a memo.</text>
<rect x="756" y="204" width="396" height="120" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="756" y="216" width="5" height="96" rx="2.5" fill="#d0453f"/>
<circle cx="792" cy="234" r="15" fill="#d0453f" fill-opacity="0.16" stroke="#d0453f" stroke-width="1.5"/>
<text x="792" y="240" font-size="15" font-weight="800" fill="#d0453f" text-anchor="middle">4</text>
<text x="816" y="236" font-size="20" font-weight="700" fill="#10261b" text-anchor="start">Constraints</text>
<text x="778" y="264" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Content rules, and how far the worker may</text>
<text x="778" y="286" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">go alone.</text>
<rect x="344" y="340" width="808" height="40" rx="10" fill="#8a9a91" fill-opacity="0.1" stroke="#8a9a91" stroke-width="1.5"/>
<text x="362" y="366" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">Control: name any step that policy, law or a system requires. Every other step is method, left to the worker.</text>
</g>
