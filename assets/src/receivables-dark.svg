<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The life of an invoice</title>
<desc id="d">Copperleaf delivers, then sends an invoice. The due date is the invoice date plus the payment terms. When a payment arrives with its remittance, it is matched to its invoice, which becomes paid; a payment nobody can match is unallocated and a person decides. Aged receivables sort every open invoice into one band: not yet due, 1 to 30, 31 to 60, 61 to 90 and over 90 days overdue. The policy says when reminders, calls and a hold happen.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb5a1"/></marker></defs>
<rect width="1200" height="430" rx="18" fill="#0f1914"/>
<rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="18" fill="none" stroke="#2c4437" stroke-width="1.5"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0">
<text x="40" y="38" font-size="14" font-weight="700" fill="#7fe0b0" text-anchor="start">THE LIFE OF AN INVOICE</text>
<rect x="40" y="66" width="196" height="128" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="40" y="78" width="5" height="104" rx="2.5" fill="#8a9a91"/>
<text x="62" y="98" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Delivery</text>
<text x="62" y="125" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Copperleaf</text>
<text x="62" y="147" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">delivers the</text>
<text x="62" y="169" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">goods.</text>
<path d="M239 130.0 L266 130.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="271" y="66" width="196" height="128" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="271" y="78" width="5" height="104" rx="2.5" fill="#9aa6ff"/>
<text x="293" y="98" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Invoice</text>
<text x="293" y="125" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">The bill: who owes</text>
<text x="293" y="147" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">how much, by when.</text>
<path d="M470 130.0 L497 130.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="502" y="66" width="196" height="128" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="502" y="78" width="5" height="104" rx="2.5" fill="#9aa6ff"/>
<text x="524" y="98" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Due date</text>
<text x="524" y="125" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Invoice date plus</text>
<text x="524" y="147" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">the payment terms.</text>
<path d="M701 130.0 L728 130.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="733" y="66" width="196" height="128" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="733" y="78" width="5" height="104" rx="2.5" fill="#3ddc97"/>
<text x="755" y="98" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Payment arrives</text>
<text x="755" y="125" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Usually with a</text>
<text x="755" y="147" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">remittance saying</text>
<text x="755" y="169" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">what it pays.</text>
<path d="M932 130.0 L959 130.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="964" y="66" width="196" height="128" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="964" y="78" width="5" height="104" rx="2.5" fill="#3ddc97"/>
<text x="986" y="98" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Matched</text>
<text x="986" y="125" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Allocated to its</text>
<text x="986" y="147" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">invoice, which is</text>
<text x="986" y="169" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">now paid.</text>
<rect x="964" y="236" width="196" height="112" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="964" y="248" width="5" height="88" rx="2.5" fill="#ff7a72"/>
<text x="986" y="268" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Can't match it?</text>
<text x="986" y="295" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">It stays</text>
<text x="986" y="317" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">unallocated. A</text>
<text x="986" y="339" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">person decides.</text>
<path d="M831.0 197 L831.0 214 L1062.0 214 L1062.0 231" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="40" y="236" font-size="17" font-weight="700" fill="#eef6f1" text-anchor="start">Aged receivables: every open invoice sits in one band</text>
<rect x="40" y="252" width="164" height="48" rx="10" fill="#8a9a91" fill-opacity="0.16" stroke="#8a9a91" stroke-width="1.5"/>
<text x="122.0" y="282" font-size="16" font-weight="700" fill="#8a9a91" text-anchor="middle">Not yet due</text>
<rect x="210" y="252" width="164" height="48" rx="10" fill="#3ddc97" fill-opacity="0.16" stroke="#3ddc97" stroke-width="1.5"/>
<text x="292.0" y="282" font-size="16" font-weight="700" fill="#3ddc97" text-anchor="middle">1–30 days</text>
<rect x="380" y="252" width="164" height="48" rx="10" fill="#f4c15d" fill-opacity="0.16" stroke="#f4c15d" stroke-width="1.5"/>
<text x="462.0" y="282" font-size="16" font-weight="700" fill="#f4c15d" text-anchor="middle">31–60</text>
<rect x="550" y="252" width="164" height="48" rx="10" fill="#f4c15d" fill-opacity="0.16" stroke="#f4c15d" stroke-width="1.5"/>
<text x="632.0" y="282" font-size="16" font-weight="700" fill="#f4c15d" text-anchor="middle">61–90</text>
<rect x="720" y="252" width="164" height="48" rx="10" fill="#ff7a72" fill-opacity="0.16" stroke="#ff7a72" stroke-width="1.5"/>
<text x="802.0" y="282" font-size="16" font-weight="700" fill="#ff7a72" text-anchor="middle">Over 90</text>
<path d="M40 322 L868 322" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="40" y="348" font-size="15" font-weight="600" fill="#aec3b6" text-anchor="start">Overdue once its due date has passed; days overdue are counted from the due date</text>
<text x="40" y="378" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Reminders, then a phone call, then a hold: the policy says exactly when, and who decides. A</text>
<text x="40" y="400" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">disputed invoice isn't chased.</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
