<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">How we work: local first, human in the loop</title>
<desc id="d">Your fork on GitHub is cloned to a folder on your computer with GitHub Desktop. A Claude thread does each step in that folder and saves its work. You read every change in GitHub Desktop, then commit, tag and push it to your fork, and submit. ChatGPT repeats the same job from attached files. The AI never commits or pushes.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb5a1"/></marker></defs>
<rect width="1200" height="450" rx="18" fill="#0f1914"/>
<rect x="0.75" y="0.75" width="1198.5" height="448.5" rx="18" fill="none" stroke="#2c4437" stroke-width="1.5"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0">
<text x="40" y="38" font-size="14" font-weight="700" fill="#7fe0b0" text-anchor="start">HOW WE WORK: LOCAL FIRST, HUMAN IN THE LOOP</text>
<rect x="40" y="120" width="188" height="160" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="40" y="132" width="5" height="136" rx="2.5" fill="#9aa6ff"/>
<circle cx="76" cy="150" r="15" fill="#9aa6ff" fill-opacity="0.22" stroke="#9aa6ff" stroke-width="1.5"/>
<text x="76" y="156" font-size="15" font-weight="800" fill="#9aa6ff" text-anchor="middle">1</text>
<text x="100" y="152" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Your fork</text>
<text x="62" y="179" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Your own copy of</text>
<text x="62" y="201" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">the bootcamp on</text>
<text x="62" y="223" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">GitHub. It is</text>
<text x="62" y="245" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">public.</text>
<path d="M231 200.0 L268 200.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="273" y="120" width="188" height="160" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="273" y="132" width="5" height="136" rx="2.5" fill="#9aa6ff"/>
<circle cx="309" cy="150" r="15" fill="#9aa6ff" fill-opacity="0.22" stroke="#9aa6ff" stroke-width="1.5"/>
<text x="309" y="156" font-size="15" font-weight="800" fill="#9aa6ff" text-anchor="middle">2</text>
<text x="333" y="152" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Your folder</text>
<text x="295" y="179" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Your clone, on</text>
<text x="295" y="201" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">your computer.</text>
<text x="295" y="223" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">GitHub Desktop</text>
<text x="295" y="245" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">keeps it in sync.</text>
<path d="M464 200.0 L501 200.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="506" y="120" width="188" height="160" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="506" y="132" width="5" height="136" rx="2.5" fill="#3ddc97"/>
<circle cx="542" cy="150" r="15" fill="#3ddc97" fill-opacity="0.22" stroke="#3ddc97" stroke-width="1.5"/>
<text x="542" y="156" font-size="15" font-weight="800" fill="#3ddc97" text-anchor="middle">3</text>
<text x="566" y="152" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Claude does</text>
<text x="566" y="175" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">the step</text>
<text x="528" y="202" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">One thread per</text>
<text x="528" y="224" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">step works in</text>
<text x="528" y="246" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">your folder and</text>
<text x="528" y="268" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">saves into work/.</text>
<path d="M697 200.0 L734 200.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="739" y="120" width="188" height="160" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="739" y="132" width="5" height="136" rx="2.5" fill="#f4c15d"/>
<circle cx="775" cy="150" r="15" fill="#f4c15d" fill-opacity="0.22" stroke="#f4c15d" stroke-width="1.5"/>
<text x="775" y="156" font-size="15" font-weight="800" fill="#f4c15d" text-anchor="middle">4</text>
<text x="799" y="152" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">You check</text>
<text x="761" y="179" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Read every change</text>
<text x="761" y="201" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">in GitHub</text>
<text x="761" y="223" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Desktop. Fix or</text>
<text x="761" y="245" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">refuse what is</text>
<text x="761" y="267" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">wrong.</text>
<path d="M930 200.0 L967 200.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="972" y="120" width="188" height="160" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="972" y="132" width="5" height="136" rx="2.5" fill="#f4c15d"/>
<circle cx="1008" cy="150" r="15" fill="#f4c15d" fill-opacity="0.22" stroke="#f4c15d" stroke-width="1.5"/>
<text x="1008" y="156" font-size="15" font-weight="800" fill="#f4c15d" text-anchor="middle">5</text>
<text x="1032" y="152" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">You keep it</text>
<text x="994" y="179" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Commit, tag and</text>
<text x="994" y="201" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">push to your</text>
<text x="994" y="223" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">fork, then submit</text>
<text x="994" y="245" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">the form.</text>
<text x="250" y="188.0" font-size="13" font-weight="600" fill="#aec3b6" text-anchor="middle">clone</text>
<path d="M1066.0 118 L1066.0 78 L134.0 78 L134.0 115" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="420" y="64" width="360" height="28" rx="6" fill="#0f1914" fill-opacity="1" stroke="#0f1914" stroke-width="1.5"/>
<text x="600" y="84" font-size="15" font-weight="600" fill="#aec3b6" text-anchor="middle">push: only checked work reaches GitHub</text>
<rect x="506" y="326" width="421" height="92" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="506" y="338" width="5" height="68" rx="2.5" fill="#9aa6ff"/>
<text x="528" y="358" font-size="19" font-weight="700" fill="#eef6f1" text-anchor="start">Repeat it in ChatGPT</text>
<text x="528" y="385" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">Attach the same files, give the same job,</text>
<text x="528" y="407" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">save its result into work/ and compare.</text>
<path d="M600.0 283 L600.0 321" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="610.0" y="312" font-size="14" font-weight="600" fill="#aec3b6" text-anchor="start">same job</text>
<rect x="40" y="326" width="421" height="92" rx="14" fill="#ff7a72" fill-opacity="0.16" stroke="#ff7a72" stroke-width="1.5"/>
<text x="62" y="364" font-size="18" font-weight="700" fill="#ff7a72" text-anchor="start">The AI never commits or pushes.</text>
<text x="62" y="390" font-size="16" font-weight="400" fill="#aec3b6" text-anchor="start">A person reads every change before it is kept.</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
