<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The order of a delegated job</title>
<desc id="d">Before the run, write and commit four things: the brief, the knowledge (KSoR concepts), the Authority Envelope and the review contract. Then the worker runs the job. You read its record first, then run four checks in order: recompute, trace, match and compare. Each output gets a verdict: ready to use, requires revision, or requires human correction. A person signs before anything leaves the company. You learn the four documents one at a time in steps 17 to 20, in a different order; on a real job, all four are ready before the run.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b7a6a"/></marker></defs>
<rect width="1200" height="500" rx="18" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="18" fill="none" stroke="#cfdcd4" stroke-width="1.5"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0">
<text x="40" y="38" font-size="14" font-weight="700" fill="#1f7a50" text-anchor="start">THE ORDER OF A DELEGATED JOB</text>
<text x="40" y="80" font-size="17" font-weight="700" fill="#10261b" text-anchor="start">Before the run: write it, then commit it</text>
<rect x="40" y="98" width="196" height="144" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="40" y="110" width="5" height="120" rx="2.5" fill="#1f9d63"/>
<circle cx="76" cy="128" r="15" fill="#1f9d63" fill-opacity="0.16" stroke="#1f9d63" stroke-width="1.5"/>
<text x="76" y="134" font-size="15" font-weight="800" fill="#1f9d63" text-anchor="middle">1</text>
<text x="100" y="130" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">Brief</text>
<text x="62" y="157" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">The job: outcome,</text>
<text x="62" y="179" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">context, format,</text>
<text x="62" y="201" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">constraints.</text>
<path d="M239 170 L266 170" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="271" y="98" width="196" height="144" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="271" y="110" width="5" height="120" rx="2.5" fill="#1f9d63"/>
<circle cx="307" cy="128" r="15" fill="#1f9d63" fill-opacity="0.16" stroke="#1f9d63" stroke-width="1.5"/>
<text x="307" y="134" font-size="15" font-weight="800" fill="#1f9d63" text-anchor="middle">2</text>
<text x="331" y="130" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">Knowledge</text>
<text x="293" y="157" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">Approved KSoR</text>
<text x="293" y="179" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">concepts it</text>
<text x="293" y="201" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">answers from.</text>
<path d="M470 170 L497 170" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="502" y="98" width="196" height="144" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="502" y="110" width="5" height="120" rx="2.5" fill="#1f9d63"/>
<circle cx="538" cy="128" r="15" fill="#1f9d63" fill-opacity="0.16" stroke="#1f9d63" stroke-width="1.5"/>
<text x="538" y="134" font-size="15" font-weight="800" fill="#1f9d63" text-anchor="middle">3</text>
<text x="562" y="130" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">Envelope</text>
<text x="524" y="157" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">What it may do</text>
<text x="524" y="179" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">alone, and when it</text>
<text x="524" y="201" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">escalates.</text>
<path d="M701 170 L728 170" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="733" y="98" width="196" height="144" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="733" y="110" width="5" height="120" rx="2.5" fill="#c98a1a"/>
<circle cx="769" cy="128" r="15" fill="#c98a1a" fill-opacity="0.16" stroke="#c98a1a" stroke-width="1.5"/>
<text x="769" y="134" font-size="15" font-weight="800" fill="#c98a1a" text-anchor="middle">4</text>
<text x="793" y="130" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">Review</text>
<text x="793" y="153" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">contract</text>
<text x="755" y="180" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">What you will</text>
<text x="755" y="202" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">check, and what</text>
<text x="755" y="224" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">counts as success.</text>
<path d="M932 170 L959 170" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="964" y="128" width="196" height="84" rx="42" fill="#c98a1a" fill-opacity="0.14" stroke="#c98a1a" stroke-width="1.5"/>
<text x="1062.0" y="164" font-size="19" font-weight="800" fill="#c98a1a" text-anchor="middle">Commit</text>
<text x="1062.0" y="190" font-size="14" font-weight="600" fill="#4d6156" text-anchor="middle">History proves the order</text>
<text x="271" y="284" font-size="17" font-weight="700" fill="#10261b" text-anchor="start">After the run: check, decide, sign</text>
<rect x="40" y="300" width="196" height="150" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<rect x="40" y="312" width="5" height="126" rx="2.5" fill="#4f5fe0"/>
<circle cx="76" cy="330" r="15" fill="#4f5fe0" fill-opacity="0.16" stroke="#4f5fe0" stroke-width="1.5"/>
<text x="76" y="336" font-size="15" font-weight="800" fill="#4f5fe0" text-anchor="middle">5</text>
<text x="100" y="332" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">The run</text>
<text x="62" y="359" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">The worker does</text>
<text x="62" y="381" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">the job. Read its</text>
<text x="62" y="403" font-size="16" font-weight="400" fill="#4d6156" text-anchor="start">record first.</text>
<path d="M1062.0 214 L1062.0 258 L138 258 L138 295" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="271" y="300" width="427" height="150" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<text x="293" y="332" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">Four checks, in order</text>
<rect x="293" y="348" width="188" height="44" rx="10" fill="#4f5fe0" fill-opacity="0.1" stroke="#4f5fe0" stroke-width="1.5"/>
<text x="305" y="367" font-size="15" font-weight="800" fill="#4f5fe0" text-anchor="start">Recompute</text>
<text x="305" y="385" font-size="13" font-weight="600" fill="#4d6156" text-anchor="start">redo the numbers</text>
<rect x="493" y="348" width="188" height="44" rx="10" fill="#4f5fe0" fill-opacity="0.1" stroke="#4f5fe0" stroke-width="1.5"/>
<text x="505" y="367" font-size="15" font-weight="800" fill="#4f5fe0" text-anchor="start">Trace</text>
<text x="505" y="385" font-size="13" font-weight="600" fill="#4d6156" text-anchor="start">open each source</text>
<rect x="293" y="398" width="188" height="44" rx="10" fill="#4f5fe0" fill-opacity="0.1" stroke="#4f5fe0" stroke-width="1.5"/>
<text x="305" y="417" font-size="15" font-weight="800" fill="#4f5fe0" text-anchor="start">Match</text>
<text x="305" y="435" font-size="13" font-weight="600" fill="#4d6156" text-anchor="start">every item once</text>
<rect x="493" y="398" width="188" height="44" rx="10" fill="#4f5fe0" fill-opacity="0.1" stroke="#4f5fe0" stroke-width="1.5"/>
<text x="505" y="417" font-size="15" font-weight="800" fill="#4f5fe0" text-anchor="start">Compare</text>
<text x="505" y="435" font-size="13" font-weight="600" fill="#4d6156" text-anchor="start">same fact everywhere</text>
<path d="M239 375 L267 375" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="733" y="300" width="250" height="150" rx="14" fill="#ffffff" fill-opacity="1" stroke="#cfdcd4" stroke-width="1.5"/>
<text x="755" y="332" font-size="19" font-weight="700" fill="#10261b" text-anchor="start">Verdict</text>
<rect x="755" y="348" width="210" height="26" rx="13.0" fill="#1f9d63" fill-opacity="0.1" stroke="#1f9d63" stroke-width="1.5"/>
<text x="860.0" y="365.68" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle">Ready to use</text>
<rect x="755" y="380" width="210" height="26" rx="13.0" fill="#c98a1a" fill-opacity="0.1" stroke="#c98a1a" stroke-width="1.5"/>
<text x="860.0" y="397.68" font-size="13" font-weight="700" fill="#c98a1a" text-anchor="middle">Requires revision</text>
<rect x="755" y="412" width="210" height="26" rx="13.0" fill="#d0453f" fill-opacity="0.1" stroke="#d0453f" stroke-width="1.5"/>
<text x="860.0" y="429.68" font-size="13" font-weight="700" fill="#d0453f" text-anchor="middle">Requires human correction</text>
<path d="M701 375 L729 375" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="1018" y="300" width="142" height="150" rx="14" fill="#c98a1a" fill-opacity="0.14" stroke="#c98a1a" stroke-width="1.5"/>
<text x="1089" y="364" font-size="18" font-weight="800" fill="#c98a1a" text-anchor="middle">A person</text>
<text x="1089" y="388" font-size="18" font-weight="800" fill="#c98a1a" text-anchor="middle">signs</text>
<text x="1089" y="416" font-size="13" font-weight="400" fill="#4d6156" text-anchor="middle">before it leaves</text>
<path d="M986 375 L1014 375" fill="none" stroke="#5b7a6a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="40" y="482" font-size="15" font-weight="600" fill="#4d6156" text-anchor="start">You learn these one at a time in steps 17 to 20 (brief, review contract, envelope, knowledge). On a real job, prepare all four before the run.</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
